<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temp Converter - OIBSIP Task 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)}
.box{background:white;padding:35px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.2);width:380px;max-width:90%}
h2{text-align:center;margin-bottom:5px}
.sub{text-align:center;font-size:14px;color:#666;margin-bottom:20px}
label{font-weight:bold;margin-top:10px;display:block}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;font-size:15px}
button{background:#667eea;color:white;border:none;font-weight:bold;cursor:pointer;margin-top:15px}
button:hover{background:#5a6fd6}
#result{margin-top:20px;padding:15px;background:#eef2ff;border-radius:8px;text-align:center;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h2>Temperature Converter</h2>
<p class="sub">Celsius ↔ Fahrenheit - OIBSIP Task 3</p>

<label>Enter Temperature:</label>
<input type="number" id="temp" placeholder="Ex: 100">

<label>Convert From:</label>
<select id="unit">
<option value="c2f">Celsius to Fahrenheit</option>
<option value="f2c">Fahrenheit to Celsius</option>
</select>

<button onclick="convert()">Convert Now</button>
<div id="result">Result will appear here</div>

<p style="text-align:center;margin-top:15px;font-size:12px;color:#888">By Kishore Vamisetti</p>
</div>

<script>
function convert(){
 let t = parseFloat(document.getElementById('temp').value);
 let u = document.getElementById('unit').value;
 let r = document.getElementById('result');
 if(isNaN(t)){ r.innerHTML="❌ Please enter a number"; return; }
 let res;
 if(u=='c2f'){ res=(t*9/5)+32; r.innerHTML= t+"°C = "+res.toFixed(2)+"°F"; }
 else { res=(t-32)*5/9; r.innerHTML= t+"°F = "+res.toFixed(2)+"°C"; }
}
</script>
</body>
</html>
